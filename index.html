<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club PTO · Toronto's padel social club</title>
    <meta name="description" content="Thursday meets at District Padel, the PTO League on Sundays, and COURTSIDE. Every level welcome. Book a pass or book PTO for your team." />
    <meta name="author" content="Club PTO" />
    <link rel="canonical" href="https://clubpto.com/" />

    <!-- Google Fonts. Barlow Condensed + Barlow are the redesigned public
         site (src/site), since Oct 15 2026. Bricolage Grotesque, DM Sans,
         Yellowtail and VT323 are still used by the older pages, /manage and
         /club; Playfair Display stays as /manage's heading fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: the stylesheet arrives as a
         non-applying "print" sheet and flips to "all" once it lands. The URL
         already carries display=swap, so text paints immediately in the
         fallback face and swaps when the real one is ready. Blocking here
         cost ~800ms of white screen on a throttled phone. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:opsz,wght@9..40,300..700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Yellowtail&family=VT323&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:opsz,wght@9..40,300..700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Yellowtail&family=VT323&display=swap"
      />
    </noscript>

    <!-- Home-screen install metadata. Static, hand-maintained: the PWA plugin
         that used to generate this also generated a precaching service worker,
         which pinned a retired design on returning devices. iOS add-to-home
         works from these tags; Chrome's install prompt needs a worker and is
         therefore off until we choose to bring one back deliberately. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0E2418" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Club PTO" />

    <meta property="og:title" content="Club PTO · Toronto's padel social club" />
    <meta property="og:description" content="Thursday meets, the PTO League and COURTSIDE. Every level welcome." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clubpto.com/" />
    <meta property="og:image" content="https://clubpto.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://clubpto.com/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
